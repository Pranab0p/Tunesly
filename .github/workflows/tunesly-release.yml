name: Tunesly Auto-Build & In-App Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.2.5)'
        required: true
      notes:
        description: 'Release notes'
        required: false
        default: 'Performance improvements and new features.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Signing Keystore & Config
        run: |
          echo "LISTEN_TOGETHER_SERVER=https://www.tunesly.online" > local.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tunesly-release.jks
          {
            echo "storeFile=tunesly-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Prod Release APKs
        run: ./gradlew :app:assembleProdRelease -Pbitchord.bundleWear=false

      - name: Prepare Release Assets
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/prod/release/app-prod-arm64-v8a-release.apk "Tunesly-${TAG}-arm64.apk"
          cp app/build/outputs/apk/prod/release/app-prod-universal-release.apk "Tunesly-${TAG}-universal.apk"

      - name: Publish GitHub Release (Fast Global CDN)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Tunesly v${{ steps.meta.outputs.version }}
          body: ${{ github.event.inputs.notes || 'New Tunesly update!' }}
          files: |
            Tunesly-${{ steps.meta.outputs.version }}-arm64.apk
            Tunesly-${{ steps.meta.outputs.version }}-universal.apk

      - name: Notify Tunesly VPS In-App Updater
        run: |
          VER="${{ steps.meta.outputs.version }}"
          REPO="${{ github.repository }}"
          ARM64_URL="https://github.com/${REPO}/releases/download/v${VER}/Tunesly-${VER}-arm64.apk"
          UNIV_URL="https://github.com/${REPO}/releases/download/v${VER}/Tunesly-${VER}-universal.apk"
          curl -s -X POST "https://tunesly.online/api/app/update-version" \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${VER}\",\"apkUrl\":\"${ARM64_URL}\",\"apkArm64Url\":\"${ARM64_URL}\",\"apkUniversalUrl\":\"${UNIV_URL}\",\"releaseUrl\":\"https://github.com/${REPO}/releases/tag/v${VER}\",\"notes\":\"${{ github.event.inputs.notes || 'New Tunesly update!' }}\",\"adminKey\":\"${{ secrets.TUNESLY_ADMIN_KEY }}\"}"
